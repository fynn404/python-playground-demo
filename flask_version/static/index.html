<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-gray-800 mb-8">Python Playground</h1>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">Code Editor</h2>
                    <div class="space-x-2">
                        <button onclick="runCode()"
                            class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition-colors">
                            Run Code
                        </button>
                        <button onclick="formatCode()"
                            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-colors">
                            Format Code
                        </button>
                    </div>
                </div>
                <div id="editor" class="h-96 w-full border border-gray-300 rounded-md"></div>
            </div>

            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">Output</h2>
                    <button onclick="clearOutput()" class="text-gray-500 hover:text-gray-700 transition-colors">
                        Clear
                    </button>
                </div>
                <div id="output"
                    class="h-96 w-full border border-gray-300 rounded-md p-4 font-mono text-sm overflow-auto bg-gray-50">
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
